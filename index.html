    <h1>Hola de Buenos Aires</h1>

    <p>Compra: <span id="buy">Cargando...</span></p>
    <p>Venta: <span id="sell">Cargando...</span></p>
    <input type="number" id="usd-input" placeholder="Dollars (USD)" oninput="convert()">
    <p>Sera en pesos: <span id="pesos-result">0</span> ARS</p> 
    </div>
    <button onclick="getRate()">Averiguar la tasa</button>

let currentRate = 0;

function getRate() {
    // Pishem pered ssulkoy specialnuy most, kotoruy otkroet nam dostup bez oshibok
  /*const proxy = 'https://herokuapp.com';
    const url = 'https://dolarapi.com';*/
    const url = 'https://dolarapi.com/v1/dolares/blue';
    // Vkluchaem nadpis "Cargando...", poca letit zapros
    document.getElementById('buy').innerText = 'Cargando...';
    document.getElementById('sell').innerText = 'Cargando...';
    
    fetch(url)
    .then(response => response.json())
    .then(data => {
        // Berem realnuy cifry iz argentinskogo API!
        document.getElementById('buy').innerText = data.compra + 'ARS'; 
        document.getElementById('sell').innerText = data.venta + 'ARS';
        currentRate = data.venta;
    })
    .catch(error => {
console.error('Oshibka:', error);
document.getElementById('buy').innerText = 'Oshibka';
    });
}



function convert() { 

const dollars = 
document.getElementById('usd-input').value;

const  result = dollars * currentRate;

document.getElementById('pesos-result').innerText = result;

}
